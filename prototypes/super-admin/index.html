<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>KSS Super Admin — Portfolio UI Concepts</title>
<style>

:root { --bg:#0a1119; --panel:#111d27; --panel2:#162530; --panel3:#1b2b37; --stroke:#273948; --muted:#8ea6b4; --text:#eff9fc; --green:#18dc9c; --green2:#13b989; --mint:#8affd1; --blue:#51a9fb; --gold:#ffcd77; --purple:#b7a2fa; --red:#ff818f; --shadow:0 22px 60px #00000030; }
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);font-family:system-ui,'Noto Sans Bengali',system-ui,Arial,sans-serif;color:var(--text);font-size:14px} button,input{font:inherit} button{cursor:pointer} body{overflow:hidden}
.app{display:flex;width:100vw;height:100vh;min-width:1120px;background:radial-gradient(1000px 600px at 90% -20%, #0c514345, transparent 70%),linear-gradient(135deg,#0b131b,#0b141d)}
.sidebar{width:256px;flex:0 0 256px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0d1821 0%,#0c151d 100%);border-right:1px solid #233542;padding:24px 16px 18px;box-shadow:10px 0 40px #00000015;z-index:1}
.brand{display:flex;align-items:center;gap:12px;padding:1px 6px 20px;border-bottom:1px solid #263a46;margin-bottom:18px}
.brandmark{height:41px;width:41px;display:grid;place-items:center;border:1px solid #2deab1;border-radius:13px;background:linear-gradient(145deg,#0aa978,#066343);box-shadow:0 4px 26px #0ddb9250;font-weight:900;letter-spacing:-1px;font-size:19px;color:white}
.brandname{font-size:16px;font-weight:800;letter-spacing:-.4px}.brandsub{font-size:10px;color:var(--muted);line-height:1.5;margin-top:2px}.menu-title{font-size:10px;color:#668191;font-weight:800;letter-spacing:1.25px;margin:10px 14px 8px}
.nav-items{flex:1;overflow:hidden}.nav{display:flex;align-items:center;gap:12px;border:1px solid transparent;border-radius:9px;height:39px;padding:0 13px;margin:2px 0;color:#9db1bc;text-align:left;background:transparent;width:100%;font-size:12.5px;font-weight:600;transition:.17s}.nav:hover{background:#192831;color:#fff}.nav.active{background:linear-gradient(90deg,#0c966f,#0b705a);color:white;border-color:#1ddb9a55;box-shadow:0 5px 18px #04b97b24}.nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.nav .push{margin-left:auto;font-size:10px;color:#eff;border-radius:6px;background:#ffffff1a;padding:2px 5px}
.side-bottom{margin-top:12px;padding:12px 12px;border:1px solid #224237;border-radius:12px;background:#0d30264d}.side-bottom .dot{background:#12d98e;width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;box-shadow:0 0 12px #26e9a0}.side-bottom .st{color:#a2b5c2;font-size:10px;margin-top:4px}
.workspace{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:75px;flex:0 0 75px;display:flex;align-items:center;justify-content:space-between;padding:0 42px;border-bottom:1px solid #233644;background:#0b1720d9}.crumbs{display:flex;gap:10px;align-items:center;color:#8fa8b5;font-size:12px;font-weight:600}.crumbs b{color:#c5d7dd;font-weight:700}.crumbs .slash{color:#42606d}.search{margin-left:auto;width:222px;height:35px;border:1px solid #263e4b;background:#13212a;border-radius:9px;display:flex;align-items:center;color:#6f8d9f;padding:0 11px;font-size:11px;gap:8px}.top-actions{display:flex;align-items:center;gap:20px;margin-left:25px}.status-pill{color:#8bf4ca;border:1px solid #226b50;background:#113c30;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700}.avatar{display:flex;align-items:center;gap:9px}.circle{width:35px;height:35px;background:linear-gradient(140deg,#20cf93,#0a705a);display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;font-size:12px}.ava-name{font-weight:700;font-size:12px}.ava-role{font-size:10px;color:#8fb4a8;margin-top:1px}.bell{width:16px;height:17px;border:2px solid #b3c7d0;border-radius:9px 9px 4px 4px;position:relative}.bell:after{content:'';width:7px;height:7px;position:absolute;right:-5px;top:-5px;background:#ff7181;border-radius:50%;border:2px solid #0e1a25}
.main{overflow:auto;flex:1;padding:37px 42px 40px;scrollbar-color:#233d49 transparent}.page-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:27px}.eyebrow{color:#23dda5;letter-spacing:1.8px;font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:9px}.h1{font-weight:800;font-size:30px;letter-spacing:-.75px;line-height:1.17;margin:0 0 10px}.lead{font-size:12px;color:#9cb3bf;max-width:720px;line-height:1.6;margin:0}.headright{display:flex;gap:9px;align-items:center;flex:0 0 auto;padding-top:8px}.action{height:38px;white-space:nowrap;border-radius:9px;border:1px solid #34525b;background:#142831;color:#b9d4da;font-weight:700;font-size:11px;padding:0 15px}.action.green{background:linear-gradient(120deg,#16ca8c,#0ba877);border-color:#22dfa6;color:white;box-shadow:0 6px 19px #08ca8b1f}.action.ghost{background:#132630}.action.light{background:#193944;color:#b1f5df;border-color:#255b53}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.metric{background:linear-gradient(130deg,#172530,#14212b);border:1px solid #2b3d49;border-radius:14px;min-height:128px;padding:19px 20px;position:relative;overflow:hidden;box-shadow:0 10px 27px #00000016}.metric:after{content:'';position:absolute;height:95px;width:95px;border-radius:50%;top:-43px;right:-38px;background:var(--glow,#06a978);filter:blur(52px);opacity:.21}.metric-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.metric-icon{height:35px;width:35px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--iconbg,#0c513c);color:var(--accent,#2ee5a6);border:1px solid #ffffff0b}.metric-sub{font-size:10px;color:#8da5b3;font-weight:700}.metric-val{font-size:30px;font-weight:800;letter-spacing:-1px;margin:0;line-height:1.2}.metric-label{font-size:12px;color:#b9cad2;font-weight:650;margin-top:4px}.metric-note{font-size:10px;color:#7d9a9d;margin-top:5px}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}.gridhalf{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:linear-gradient(160deg,#172631,#12202a);border:1px solid #2b404e;border-radius:14px;box-shadow:0 14px 36px #00000012;overflow:hidden;margin-bottom:18px}.panel-inner{padding:20px 22px}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 21px;border-bottom:1px solid #2b3d49}.panel-title{font-weight:750;font-size:14px;letter-spacing:-.1px}.panel-desc{font-size:11px;color:#8ca4b1;margin-top:4px}.panel-tools{display:flex;gap:8px}.chip{font-size:10px;color:#a0bec3;border:1px solid #314a54;background:#1d3039;padding:6px 10px;border-radius:7px;font-weight:700;white-space:nowrap}.chip.on{background:#0e604c;color:#b2ffe4;border-color:#148b67}.chip.yellow{color:#ffdd92;background:#4a3a24;border-color:#69552f}.chip.blue{color:#b6d9ff;background:#20364e;border-color:#355773}.chip.purple{color:#e7d9ff;background:#382e4a;border-color:#5b4878}.chip.rose{color:#ffc6cb;background:#4d3038;border-color:#764753}.toolbar{padding:14px 20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #273b48}.fake-search{height:37px;min-width:220px;flex:1;max-width:390px;border:1px solid #304956;background:#10212b;padding:0 13px;display:flex;align-items:center;border-radius:8px;color:#7899a7;font-size:11px}.tbtn{height:35px;border-radius:8px;color:#a7c0c9;border:1px solid #344c59;background:#1a2d38;padding:0 11px;font-weight:650;font-size:11px}.tbtn.green{color:#bcffdf;border-color:#168961;background:#15553f}.spacer{flex:1}
.table{width:100%;border-collapse:collapse;text-align:left;font-size:11px}.table th{font-size:9px;text-transform:uppercase;letter-spacing:1.1px;color:#7e9ba9;background:#172731;font-weight:800;padding:14px 14px}.table td{padding:14px 14px;border-top:1px solid #29404a;color:#cedde1;line-height:1.35}.table tr:nth-child(even) td{background:#15232d77}.table .rowbold{font-weight:700;color:#edf6f7}.td-sub{font-size:9px;color:#89a3b0;display:block;margin-top:5px}.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:9px;font-weight:800;color:#b6f9d7;background:#123c2f;border:1px solid #236d51}.status.warning{color:#ffe0a8;background:#413323;border-color:#655038}.status.muted{color:#bdd0d8;background:#2b3842;border-color:#44515b}.status.blue{color:#a9d0ff;background:#17334f;border-color:#2b5a82}.button-mini{height:25px;width:28px;border:1px solid #31695f;background:#174539;color:#a4ffe0;border-radius:6px;font-size:11px;display:inline-grid;place-items:center;margin-right:4px}.button-mini.red{background:#4e2935;border-color:#784456;color:#ffb1b8}.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;height:250px;color:#839ca9}.empty .ring{border:1px solid #2d584d;background:#13332c;width:62px;height:62px;border-radius:22px;display:grid;place-items:center;color:#4ff1b8;font-size:27px;margin-bottom:15px}.empty b{color:#e0ebef;font-size:13px}.empty small{font-size:10px;margin-top:7px;color:#8da8b6}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgroup label{font-weight:700;color:#aabdc7;font-size:10px;display:block;margin-bottom:9px}.inputlook{height:43px;border-radius:8px;padding:12px;background:#10202a;border:1px solid #2a4050;color:#e6f3f6;font-size:12px}.subline{height:1px;background:#293c48;margin:16px 0}.progress{width:100%;height:8px;border-radius:8px;background:#253641;overflow:hidden;margin-top:11px}.progress span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#09b77c,#55f4b5)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item-card{background:#192a34;border:1px solid #304651;border-radius:12px;padding:17px}.item-title{font-weight:750;font-size:12px;margin-bottom:8px}.item-desc{color:#91aab5;font-size:10px;line-height:1.6}.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.list-mini{padding:0 0}.list-row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #263b47}.list-row:last-child{border-bottom:0}.row-icon{height:33px;width:33px;border-radius:10px;background:#0d5744;border:1px solid #1b745a;display:grid;place-items:center;color:#92f9cb;font-weight:800}.list-row .label{flex:1;font-weight:700;font-size:11px}.list-row small{font-weight:450;font-size:9px;color:#90a5b0;display:block;margin-top:5px}.statebar{display:flex;gap:10px;margin-bottom:14px}.statebar .s{padding:10px 16px;background:#18313b;border:1px solid #2d515c;border-radius:9px;font-size:10px;color:#b7d1d8}.statebar .s.active{color:#abffe1;background:#0b5943;border-color:#16b884}.watermark{position:fixed;right:18px;bottom:10px;font-size:9px;letter-spacing:.6px;color:#81a5a488;z-index:4}.section-tip{padding:13px 17px;background:#0e322b;border:1px solid #1e6c56;border-radius:10px;color:#abe5d5;font-size:11px;margin:0 0 19px;line-height:1.45}
.canvascol{display:grid;grid-template-columns:260px 1fr 260px;gap:14px}.field{margin-bottom:11px;padding:13px;border:1px solid #324b57;background:#192b35;border-radius:9px;color:#d2e2e8;font-size:11px}.field label{display:block;font-size:10px;color:#a1b5c3;margin-bottom:7px}.field .mininput{height:31px;background:#10212c;border:1px solid #324653;border-radius:6px;padding:7px 10px;color:#7f9eac}.floatingpanel{background:#142630;border:1px solid #2b4954;border-radius:12px;padding:16px}.navfooter{font-size:10px;color:#587d81;margin:14px;text-align:center}
@media(max-width:1270px){.sidebar{width:230px;flex-basis:230px}.main{padding:24px}.topbar{padding:0 24px}.metrics{gap:10px}.metric{padding:16px}}
</style>
</head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="brandmark">KS</div><div><div class="brandname">Smart Seba</div><div class="brandsub">KAHALOO SMART SEBA (KSS)<br/>Super Admin Workspace</div></div></div><div class="nav-items" id="nav"></div><div class="side-bottom"><div style="font-size:11px;font-weight:800;color:#c6e8dc"><span class="dot"></span>Control Center</div><div class="st">Portfolio concept · Sanitized data</div></div></aside>
<div class="workspace"><div class="topbar"><div class="crumbs">WORKSPACE <span class="slash">/</span> <b>Super Admin</b> <span class="slash">/</span> <span id="crumbPage">Dashboard</span></div><div class="search">⌕ &nbsp; Search modules & commands <span style="margin-left:auto;color:#527484">⌘ K</span></div><div class="top-actions"><span class="status-pill">● System active</span><span class="bell"></span><div class="avatar"><div class="circle">SA</div><div><div class="ava-name">Super Admin</div><div class="ava-role">Full platform access</div></div></div></div></div><main class="main" id="page"></main></div>
</div><div class="watermark">KSS UI CONCEPT · SANITIZED PORTFOLIO PREVIEW</div>
<script>
const paths={dashboard:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',verify:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M6 17c.5-2 4.5-2 5 0M14 10h4m-4 4h4"/>',gift:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M12 9c-2-1-5-4-3-6s4 1 3 6c1-5 4-8 6-6s-1 5-6 6"/>',layers:'<path d="m12 2 9 5-9 5-9-5 9-5zm-9 10 9 5 9-5M3 17l9 5 9-5"/>',tag:'<path d="M20 13 12 21 3 12V4h8z"/><circle cx="7.5" cy="8" r="1"/>',posts:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h6"/>',form:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v18M12 8h6M12 12h6M12 16h4"/>',map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>',notice:'<path d="m3 11 18-7-6 17-3-7-7-3z"/>',admins:'<circle cx="8" cy="8" r="3"/><path d="M2 21v-2a6 6 0 0 1 12 0v2M16 8h6M19 5v6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9 7 7m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17m10-10 2.1-2.1"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',chart:'<path d="M3 19V5m0 14h18M6 16l5-6 4 3 6-8"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${paths[n]||paths.file}</svg>`;
const NAV=[['MAIN',[['dashboard','Dashboard','dashboard']]],['MANAGEMENT',[['verifications','Account Verifications','verify'],['referrals','Referrals & Coins','gift'],['sections','Sections','layers'],['categories','Categories','tag'],['posts','Posts','posts'],['forms','Form Management','form'],['locations','Locations','map']]],['CONTENT',[['notices','Notice Management','notice'],['notifications','Notifications','bell']]],['CONTROL & GOVERNANCE',[['form-builder','Form Builder Concept','form'],['admins','Admin Management','admins'],['settings','System Settings','settings']]]];
const TITLES={dashboard:'Dashboard',verifications:'Account Verifications (KYC)',notices:'Notice Management',categories:'Categories Management',referrals:'Referrals & Coins',posts:'Posts Management',sections:'Sections Management',locations:'Locations Management',forms:'Form Management', 'form-builder':'Dynamic Form Builder',admins:'Admin Management',settings:'System Settings',notifications:'Notifications'};
function navRender(active){document.getElementById('nav').innerHTML=NAV.map(([s,entries])=>`<div class="menu-title">${s}</div>${entries.map(([id,t,ic])=>`<button class="nav ${active===id?'active':''}" data-view="${id}">${svg(ic)}<span>${t}</span>${id==='posts'?'<span class="push">1</span>':''}</button>`).join('')}`).join('');document.getElementById('crumbPage').innerText=TITLES[active]||'Dashboard';document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.view))}
function head(id,desc,cta='Add new',secondary='Export report'){return `<div class="page-head"><div><div class="eyebrow">KSS · Super Admin Control Center</div><h1 class="h1">${TITLES[id]}</h1><p class="lead">${desc}</p></div><div class="headright"><button class="action ghost">${secondary}</button><button class="action green">＋ &nbsp; ${cta}</button></div></div>`}
function metric(val,label,note,ic='◈',tone='green'){let c={green:['#13dba0','#0c533e'],blue:['#64b6ff','#173d5c'],yellow:['#ffcb7d','#554020'],purple:['#c1afff','#403055'],red:['#ff7b94','#532938']}[tone];return `<div class="metric" style="--accent:${c[0]};--iconbg:${c[1]};--glow:${c[0]}"><div class="metric-top"><span class="metric-sub">KSS PLATFORM</span><span class="metric-icon">${ic}</span></div><div class="metric-val">${val}</div><div class="metric-label">${label}</div><div class="metric-note">${note}</div></div>`}
function metrics(items){return `<div class="metrics">${items.map(x=>metric(...x)).join('')}</div>`}
function panel(t,desc,content,tools=''){return `<section class="panel"><div class="panel-head"><div><div class="panel-title">${t}</div>${desc?`<div class="panel-desc">${desc}</div>`:''}</div><div class="panel-tools">${tools}</div></div>${content}</section>`}
function toolbar(search='Search records...',extras=''){return `<div class="toolbar"><div class="fake-search">⌕ &nbsp; ${search}</div><button class="tbtn">All statuses&nbsp;⌄</button>${extras}<span class="spacer"></span><button class="tbtn green">⚑ &nbsp; Filters</button></div>`}
function table(cols,rows){return `<table class="table"><thead><tr>${cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function badge(s='Active',tone=''){return `<span class="status ${tone}">${s}</span>`}
function mini(){return `<span class="button-mini">↗</span><span class="button-mini red">×</span>`}
function empty(icon,title,sub){return `<div class="empty"><div class="ring">${icon}</div><b>${title}</b><small>${sub}</small></div>`}
